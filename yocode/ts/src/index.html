<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yocode Editor</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    
    #editor {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background-color: #f8f8f8;
    }
    
    .vim-mode-indicator {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background-color: #333;
      color: white;
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <div class="vim-mode-indicator">NORMAL</div>
  
  <script src="main.js"></script>
  <script src="vim.js"></script>
</body>
</html>
